name: Android Vulkan branch build

on:
  push:
    branches:
      - vulkan
  pull_request:
    branches:
      - vulkan
  workflow_dispatch:

jobs:
  assemble-vulkan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application and pinned native sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install NDK and CMake
        run: sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Install GLSL shader compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools

      - name: Fetch pinned Mupen64Plus HLE RSP source
        run: |
          git clone https://github.com/mupen64plus/mupen64plus-rsp-hle.git third_party/mupen64plus-rsp-hle
          git -C third_party/mupen64plus-rsp-hle checkout 4cdc3051efbae9cd615f5fea37c62e5ab15a1ded

      - name: Fetch pinned paraLLEl-RDP and its Granite dependencies
        shell: bash
        run: |
          git clone https://github.com/Themaister/parallel-rdp.git third_party/parallel-rdp
          git -C third_party/parallel-rdp checkout 1cecd042b2619bc505c12bfdc713808386f2b54d
          git -C third_party/parallel-rdp submodule update --init angrylion-rdp-plus Granite
          # paraLLEl-RDP's 2024 sources use Granite's pre-refactor shader API.
          # Pin the compatible parent of the later Granite submodule update.
          git -C third_party/parallel-rdp/Granite checkout eb64a9a33cfc20d73e554de9e4f80c5cf56617b7
          git -C third_party/parallel-rdp/Granite submodule update --init \
            third_party/spirv-cross \
            third_party/shaderc \
            third_party/stb/stb \
            third_party/meshoptimizer \
            third_party/muFFT \
            third_party/volk \
            third_party/khronos/vulkan-headers
          # Granite overrides Shaderc's third-party root to Granite/third_party.
          GRANITE_THIRD_PARTY="third_party/parallel-rdp/Granite/third_party"
          git clone https://github.com/KhronosGroup/SPIRV-Headers.git "$GRANITE_THIRD_PARTY/spirv-headers"
          git -C "$GRANITE_THIRD_PARTY/spirv-headers" checkout 5e3ad389ee56fca27c9705d093ae5387ce404df4
          git clone https://github.com/KhronosGroup/SPIRV-Tools.git "$GRANITE_THIRD_PARTY/spirv-tools"
          git -C "$GRANITE_THIRD_PARTY/spirv-tools" checkout dd4b663e13c07fea4fbb3f70c1c91c86731099f7
          git clone https://github.com/KhronosGroup/glslang.git "$GRANITE_THIRD_PARTY/glslang"
          git -C "$GRANITE_THIRD_PARTY/glslang" checkout 142052fa30f9eca191aa9dcf65359fcaed09eeec

          # Granite's Android platform branch requires GameActivity, Paddleboat,
          # and Swappy. This app supplies its own Android surface and WSI, so
          # force Granite's existing headless platform implementation instead.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("third_party/parallel-rdp/Granite/application/platforms/CMakeLists.txt")
          s = p.read_text()
          old = "if (ANDROID)\n    add_granite_internal_static_lib(granite-platform application_android.cpp)"
          new = 'if (ANDROID AND NOT GRANITE_PLATFORM MATCHES "headless")\n    add_granite_internal_static_lib(granite-platform application_android.cpp)'
          if old not in s:
              raise SystemExit("Expected Granite Android platform branch not found; refusing unsafe patch")
          p.write_text(s.replace(old, new, 1))

          # paraLLEl-RDP's root CMakeLists also defines desktop replay and
          # conformance executables. They are not needed by the Android library
          # and one pulls in an optional flat_renderer.hpp source.
          p = Path("third_party/parallel-rdp/CMakeLists.txt")
          s = p.read_text()
          marker = "add_library(rdp-utils STATIC"
          if marker not in s:
              raise SystemExit("Expected paraLLEl-RDP desktop tools section not found")
          if "if (NOT ANDROID)\nadd_library(rdp-utils STATIC" not in s:
              s = s.replace(marker, "if (NOT ANDROID)\n" + marker, 1)
              s = s.rstrip() + "\nendif()\n"
          p.write_text(s)
          PY

          test -s third_party/parallel-rdp/parallel-rdp/rdp_device.hpp
          test -s third_party/parallel-rdp/Granite/vulkan/context.hpp
          test -s third_party/parallel-rdp/Granite/third_party/volk/volk.h
          test -s third_party/parallel-rdp/Granite/third_party/meshoptimizer/CMakeLists.txt
          test -s third_party/parallel-rdp/Granite/third_party/muFFT/CMakeLists.txt
          test -s third_party/parallel-rdp/Granite/third_party/spirv-headers/CMakeLists.txt
          test -s third_party/parallel-rdp/Granite/third_party/spirv-tools/CMakeLists.txt

      - name: Build pinned SDL2 for Android ARM64
        shell: bash
        run: |
          NDK="$ANDROID_HOME/ndk/27.0.12077973"
          cmake -S third_party/SDL -B build/sdl2-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=OFF \
            -DSDL_VIDEO=ON \
            -DSDL_RENDER=OFF \
            -DSDL_OPENGL=OFF \
            -DSDL_OPENGLES=OFF \
            -DSDL_VULKAN=OFF \
            -DSDL_TEST=OFF \
            -DSDL_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SHARED_LINKER_FLAGS="-landroid -llog" \
            -DCMAKE_LIBRARY_OUTPUT_DIRECTORY="$GITHUB_WORKSPACE/build/sdl2-arm64"
          cmake --build build/sdl2-arm64 --config Release --parallel 2
          test -s build/sdl2-arm64/libSDL2.so

      - name: Include SDL2 Android Java bridge classes
        shell: bash
        run: |
          SDL_JAVA_DIR="third_party/SDL/android-project/app/src/main/java/org/libsdl/app"
          test -s "$SDL_JAVA_DIR/SDLActivity.java"
          mkdir -p app/src/main/java/org/libsdl/app
          cp "$SDL_JAVA_DIR"/*.java app/src/main/java/org/libsdl/app/
          test -s app/src/main/java/org/libsdl/app/SDLActivity.java

      - name: Build Vulkan renderer and Mupen64Plus Core APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK contains Vulkan renderer and N64 Core
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -Z1 "$APK" | grep -Fx "lib/arm64-v8a/libn64vulkan.so"
          unzip -Z1 "$APK" | grep -Fx "lib/arm64-v8a/libmupen64plus.so"
          unzip -Z1 "$APK" | grep -Fx "lib/arm64-v8a/libSDL2.so"
          unzip -Z1 "$APK" | grep -Fx "lib/arm64-v8a/libmupen64plus-rsp-hle.so"
          if unzip -Z1 "$APK" | grep -E 'lib/arm64-v8a/lib(n64bridge|mupen64plus-video-GLideN64|mupen64plus-video-android)\\.so$'; then
            echo "Legacy EGL/OpenGL renderer unexpectedly packaged"
            exit 1
          fi
          while IFS= read -r so; do
            unzip -p "$APK" "$so" > build/checked-native-library.so
            if readelf -d build/checked-native-library.so | grep -Eq 'libEGL|libGLES'; then
              echo "Unexpected EGL/GLES dependency in $so"
              exit 1
            fi
          done < <(unzip -Z1 "$APK" | grep '\\.so$')

      - name: Upload Vulkan debug APK
        uses: actions/upload-artifact@v4
        with:
          name: n64-android-vulkan-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
