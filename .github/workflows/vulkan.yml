name: Android Vulkan branch build

on:
  push:
    branches:
      - vulkan
  pull_request:
    branches:
      - vulkan
  workflow_dispatch:

jobs:
  assemble-vulkan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install NDK and CMake
        run: sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

      # The current milestone validates the Android Vulkan surface bridge only.
      # SDL2 and Mupen64Plus are intentionally deferred until a Vulkan video
      # backend is integrated; building SDL standalone here caused unresolved
      # Android glue symbols and did not contribute to this milestone.
      - name: Build Vulkan bridge APK
        run: gradle --no-daemon assembleDebug

      - name: Verify Vulkan APK has no legacy graphics libraries
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -Z1 "$APK" | grep -Fx "lib/arm64-v8a/libn64vulkan.so"
          if unzip -Z1 "$APK" | grep -E 'lib/arm64-v8a/lib(n64bridge|mupen64plus-video-GLideN64|mupen64plus-video-android)\.so$'; then
            echo "Legacy EGL/OpenGL renderer unexpectedly packaged"
            exit 1
          fi
          while IFS= read -r so; do
            unzip -p "$APK" "$so" > build/checked-native-library.so
            if readelf -d build/checked-native-library.so | grep -Eq 'libEGL|libGLES'; then
              echo "Unexpected EGL/GLES dependency in $so"
              exit 1
            fi
          done < <(unzip -Z1 "$APK" | grep '\.so$')

      - name: Upload Vulkan debug APK
        uses: actions/upload-artifact@v4
        with:
          name: n64-android-vulkan-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
