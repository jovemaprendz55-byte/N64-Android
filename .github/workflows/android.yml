name: Android diagnostic build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android NDK and CMake
        run: sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          validate-wrappers: false

      - name: Build diagnostic debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify isolated JNI bridge
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          unzip -Z1 "$APK" | grep -Fx "lib/arm64-v8a/libn64bridge.so"
          unzip -p "$APK" lib/arm64-v8a/libn64bridge.so > build-n64bridge.so
          if readelf -d build-n64bridge.so | grep -E "Shared library: \[(libSDL2|libmupen64plus)\.so\]"; then
            echo "Diagnostic bridge unexpectedly depends on SDL2 or Mupen64Plus"
            exit 1
          fi
          readelf --dyn-syms -W build-n64bridge.so | grep -E "[[:space:]]Java_com_jsr_n64android_MainActivity_nativeGetStatus$"
          readelf --dyn-syms -W build-n64bridge.so | grep -E "[[:space:]]Java_com_jsr_n64android_MainActivity_nativeInitialize$"
          readelf --dyn-syms -W build-n64bridge.so | grep -E "[[:space:]]Java_com_jsr_n64android_MainActivity_nativeShutdown$"

      - name: Upload diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: n64-android-diagnostic
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
