name: Android Core isolated diagnostic build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout pinned Mupen64Plus Core sources
        uses: actions/checkout@v4
        with:
          repository: mupen64plus/mupen64plus-core
          ref: a9ca8ec0b7decd17390c76c6341cf423d5d79321
          path: third_party/mupen64plus-core

      - name: Patch pinned Core with post-reset readiness marker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("third_party/mupen64plus-core/src/device/r4300/r4300_core.c")
          source = path.read_text()
          old = "    *r4300_stop(r4300) = 0;\n    g_rom_pause = 0;"
          new = old + '\n    DebugMessage(M64MSG_INFO, "N64ANDROID_R4300_READY_20261109");'
          if source.count(old) != 1:
              raise SystemExit("Expected R4300 stop-reset block exactly once; upstream drift detected")
          path.write_text(source.replace(old, new, 1))
          PY
          git -C third_party/mupen64plus-core diff --check
          grep -F "N64ANDROID_R4300_READY_20261109" third_party/mupen64plus-core/src/device/r4300/r4300_core.c

      - name: Checkout pinned SDL2 sources
        uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: 5d249570393f7a37e037abf22cd6012a4cc56a71
          path: third_party/SDL

      - name: Install pinned SDL Android Java glue
        run: |
          SDL_JAVA="$GITHUB_WORKSPACE/third_party/SDL/android-project/app/src/main/java/org/libsdl/app"
          APP_JAVA="$GITHUB_WORKSPACE/app/src/main/java/org/libsdl/app"
          test -s "$SDL_JAVA/SDL.java"
          test -s "$SDL_JAVA/SDLActivity.java"
          test -s "$SDL_JAVA/SDLAudioManager.java"
          mkdir -p "$APP_JAVA"
          cp "$SDL_JAVA"/*.java "$APP_JAVA"/
          test -s "$APP_JAVA/SDLAudioManager.java"
          test -s "$APP_JAVA/SDLActivity.java"

      - name: Checkout pinned GLideN64 renderer source
        uses: actions/checkout@v4
        with:
          repository: gonetz/GLideN64
          ref: a04081ad6a966a9413bea63a55f502e0dc98bb18
          path: third_party/GLideN64

      - name: Checkout pinned Mupen64Plus HLE RSP plugin source
        uses: actions/checkout@v4
        with:
          repository: mupen64plus/mupen64plus-rsp-hle
          ref: dd09c7dcdc6d2cff584aacb9d519600d47d61039
          path: third_party/mupen64plus-rsp-hle

      - name: Checkout pinned Mupen64Plus SDL audio plugin source
        uses: actions/checkout@v4
        with:
          repository: mupen64plus/mupen64plus-audio-sdl
          ref: 6c2c3f8ae10b7f0f6dfe06f45ca7ca598a6b659a
          path: third_party/mupen64plus-audio-sdl

      - name: Add SDL audio lifecycle diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("third_party/mupen64plus-audio-sdl/src/main.c")
          text = path.read_text()
          replacements = [
              ("    if (l_PluginInit)\n        return M64ERR_ALREADY_INIT;",
               '    DebugMessage(M64MSG_INFO, "N64ANDROID AUDIO: PluginStartup chamado.");\n    if (l_PluginInit) { DebugMessage(M64MSG_WARNING, "N64ANDROID AUDIO: PluginStartup ja inicializado."); return M64ERR_ALREADY_INIT; }'),
              ("EXPORT void CALL AiLenChanged(void)\n{\n    if (!l_PluginInit || l_sdl_backend == NULL)",
               'EXPORT void CALL AiLenChanged(void)\n{\n    static unsigned int n64_audio_len_calls = 0;\n    ++n64_audio_len_calls;\n    if (n64_audio_len_calls == 1 || (n64_audio_len_calls % 120) == 0)\n        DebugMessage(M64MSG_INFO, "N64ANDROID AUDIO: AiLenChanged #%u init=%d backend=%p", n64_audio_len_calls, l_PluginInit, (void*) l_sdl_backend);\n    if (!l_PluginInit || l_sdl_backend == NULL)'),
              ("    if (!l_PluginInit)\n        return 0;\n\n    AudioInfo = Audio_Info;",
               '    DebugMessage(M64MSG_INFO, "N64ANDROID AUDIO: InitiateAudio init=%d RDRAM=%p DAC=%p LEN=%p", l_PluginInit, (void*) Audio_Info.RDRAM, (void*) Audio_Info.AI_DACRATE_REG, (void*) Audio_Info.AI_LEN_REG);\n    if (!l_PluginInit) return 0;\n\n    AudioInfo = Audio_Info;'),
              ("EXPORT int CALL RomOpen(void)\n{\n    if (!l_PluginInit || l_sdl_backend != NULL)\n        return 0;",
               'EXPORT int CALL RomOpen(void)\n{\n    DebugMessage(M64MSG_INFO, "N64ANDROID AUDIO: RomOpen init=%d backend=%p", l_PluginInit, (void*) l_sdl_backend);\n    if (!l_PluginInit || l_sdl_backend != NULL) { DebugMessage(M64MSG_WARNING, "N64ANDROID AUDIO: RomOpen recusado pelo estado."); return 0; }'),
              ("    l_sdl_backend = init_sdl_backend_from_config(l_ConfigAudio);\n\n    return 1;",
               '    l_sdl_backend = init_sdl_backend_from_config(l_ConfigAudio);\n    DebugMessage(M64MSG_INFO, "N64ANDROID AUDIO: backend criado=%p", (void*) l_sdl_backend);\n\n    return l_sdl_backend != NULL ? 1 : 0;')
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit("Trecho esperado nao encontrado em main.c: " + old[:90])
              text = text.replace(old, new, 1)
          path.write_text(text)

          backend_path = Path("third_party/mupen64plus-audio-sdl/src/sdl_backend.c")
          backend = backend_path.read_text()
          sdl_include = "#include <SDL.h>\n"
          if backend.count(sdl_include) != 1:
              raise SystemExit("Include SDL.h nao encontrado exatamente uma vez")
          backend = backend.replace(sdl_include, sdl_include + "#include <SDL_main.h>\n", 1)
          old_condition = "if (SDL_Init(SDL_INIT_AUDIO | SDL_INIT_TIMER) < 0)"
          new_condition = """SDL_SetMainReady();
                  DebugMessage(M64MSG_INFO, "N64ANDROID AUDIO: SDL_SetMainReady chamado antes do SDL_Init.");
                  int n64_sdl_init_result = SDL_Init(SDL_INIT_AUDIO | SDL_INIT_TIMER);
                  DebugMessage(M64MSG_ERROR,
                      "N64ANDROID AUDIO: SDL_Init resultado=%d erro=%s SDL_WasInit=0x%x",
                      n64_sdl_init_result, SDL_GetError(), SDL_WasInit(0));
                  if (n64_sdl_init_result < 0)"""
          if backend.count(old_condition) != 1:
              raise SystemExit("Condicao SDL_Init nao encontrada exatamente uma vez")
          backend = backend.replace(old_condition, new_condition, 1)
          old_message = 'DebugMessage(M64MSG_ERROR, "Failed to initialize SDL audio subsystem.");'
          new_message = 'DebugMessage(M64MSG_ERROR, "Failed to initialize SDL audio subsystem: %s", SDL_GetError());'
          if backend.count(old_message) != 1:
              raise SystemExit("Mensagem SDL de falha nao encontrada exatamente uma vez")
          backend = backend.replace(old_message, new_message, 1)
          backend_path.write_text(backend)

          PY
          git -C third_party/mupen64plus-audio-sdl diff --check

      - name: Apply guarded Android GLES profile patch to GLideN64
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("third_party/GLideN64/src/Graphics/OpenGLContext/mupen64plus/mupen64plus_DisplayWindow.cpp")
          source = path.read_text()
          # The Android surface dimensions must be queried through EGL here.
          # GLideN64's wrapped GL function pointers are not initialized until later,
          # so calling glGetIntegerv from _getDisplaySize dereferences a null pointer.
          display_header = "#include <DisplayWindow.h>\n"
          if source.count(display_header) != 1:
              raise SystemExit("Expected DisplayWindow include exactly once")
          if "#include <EGL/egl.h>" not in source:
              source = source.replace(
                  display_header,
                  display_header + "#if defined(OS_ANDROID)\n#include <EGL/egl.h>\n#endif\n",
                  1)
          old = (
              "\tFunctionWrapper::CoreVideo_GL_SetAttribute(M64P_GL_CONTEXT_PROFILE_MASK, M64P_GL_CONTEXT_PROFILE_CORE);\n"
              "\tFunctionWrapper::CoreVideo_GL_SetAttribute(M64P_GL_CONTEXT_MAJOR_VERSION, 3);\n"
              "\tFunctionWrapper::CoreVideo_GL_SetAttribute(M64P_GL_CONTEXT_MINOR_VERSION, 3);"
          )
          new = (
              "\tFunctionWrapper::CoreVideo_GL_SetAttribute(M64P_GL_CONTEXT_PROFILE_MASK, M64P_GL_CONTEXT_PROFILE_ES);\n"
              "\tFunctionWrapper::CoreVideo_GL_SetAttribute(M64P_GL_CONTEXT_MAJOR_VERSION, 3);\n"
              "\tFunctionWrapper::CoreVideo_GL_SetAttribute(M64P_GL_CONTEXT_MINOR_VERSION, 0);"
          )
          if source.count(old) != 1:
              raise SystemExit("Expected GLideN64 context-attribute block exactly once; upstream drift detected")
          path.write_text(source.replace(old, new, 1))

          # GLideN64's desktop defaults (640x480) are not the Android surface size.
          # Read the actual GLSurfaceView viewport before calculating the game viewport.
          display_path = Path("third_party/GLideN64/src/Graphics/OpenGLContext/mupen64plus/mupen64plus_DisplayWindow.cpp")
          display_source = display_path.read_text()
          display_old = "#endif\n}\n\nvoid DisplayWindowMupen64plus::_readScreen2"
          display_new = """#elif defined(OS_ANDROID)
          \t// Query EGL directly: GLideN64's wrapped GL entry points are not initialized yet.
          \tEGLDisplay display = eglGetCurrentDisplay();
          \tEGLSurface surface = eglGetCurrentSurface(EGL_DRAW);
          \tEGLint width = 0;
          \tEGLint height = 0;
          \tif (display != EGL_NO_DISPLAY && surface != EGL_NO_SURFACE &&
          \t\teglQuerySurface(display, surface, EGL_WIDTH, &width) == EGL_TRUE &&
          \t\teglQuerySurface(display, surface, EGL_HEIGHT, &height) == EGL_TRUE &&
          \t\twidth > 0 && height > 0) {
          \t\tm_screenWidth = static_cast<u32>(width);
          \t\tm_screenHeight = static_cast<u32>(height);
          \t\tLOG(LOG_VERBOSE, "Android EGL surface size %dx%d", m_screenWidth, m_screenHeight);
          \t}
          #endif
          }

          void DisplayWindowMupen64plus::_readScreen2"""
          if display_source.count(display_old) != 1:
              raise SystemExit("Expected GLideN64 display-size function ending exactly once; upstream drift detected")
          display_path.write_text(display_source.replace(display_old, display_new, 1))

          # GLideN64 enables its private GL command thread by default on Android.
          # The app's EGL context belongs to GLSurfaceView's render thread.
          thread_path = Path("third_party/GLideN64/src/Graphics/OpenGLContext/mupen64plus/mupen64plus_DisplayWindow.cpp")
          thread_source = thread_path.read_text()
          thread_old = "\tFunctionWrapper::setThreadedMode(config.video.threadedVideo);"
          thread_new = (
              "#if defined(OS_ANDROID)\n"
              "\t// Android EGL is owned by GLSurfaceView's render thread.\n"
              "\tFunctionWrapper::setThreadedMode(0);\n"
              "#else\n"
              "\tFunctionWrapper::setThreadedMode(config.video.threadedVideo);\n"
              "#endif"
          )
          if thread_source.count(thread_old) != 1:
              raise SystemExit("Expected GLideN64 threaded-mode call exactly once; upstream drift detected")
          thread_path.write_text(thread_source.replace(thread_old, thread_new, 1))

          # Emit the actual GLideN64 settings after loading and validation.
          config_path = Path("third_party/GLideN64/src/mupenplus/Config_mupenplus.cpp")
          config_source = config_path.read_text()
          config_old = "\tconfig.validate();"
          config_new = """\tconfig.validate();
          \t// Conservative low-end Android GPU optimization: GLideN64's upstream
          \t// default enables this scaling filter, which can be slow on weaker GPUs.
          \t// Leave framebuffer emulation and all accuracy-related options unchanged.
          \tconfig.generalEmulation.enableHybridFilter = 0;
          \t// Compile GL shaders asynchronously to reduce stalls when new shaders are created.
          \tconfig.video.asyncShaderCompilation = 1;
          \t// Diagnostic performance experiment: do not pace EGL swaps to VSync.
          \t// The Android video extension now applies this through eglSwapInterval.
          \tconfig.video.verticalSync = 0;
          \t// Experimental: avoid GPU-to-RAM framebuffer readbacks on Android.
          \t// Keep framebuffer emulation itself enabled to limit visual regressions.
          \tconfig.frameBufferEmulation.copyToRDRAM = 0;
          \t// Restore normal VI cadence; adaptive skipping is handled at final presentation only.
          \tconfig.frameBufferEmulation.bufferSwapMode = Config::bsOnVerticalInterrupt;
          \tLOG(LOG_VERBOSE,
          \t    "N64ANDROID GL CONFIG: threaded=%d asyncShader=%d hybridFilter=%d legacyBlend=%d inaccurateTex=%d fbEmulation=%d copyColor=%d bilinear=%d anisotropy=%d msaa=%d vsync=%d",
          \t    config.video.threadedVideo, config.video.asyncShaderCompilation,
          \t    config.generalEmulation.enableHybridFilter,
          \t    config.generalEmulation.enableLegacyBlending,
          \t    config.generalEmulation.enableInaccurateTextureCoordinates,
          \t    config.frameBufferEmulation.enable,
          \t    config.frameBufferEmulation.copyToRDRAM,
          \t    config.texture.bilinearMode, config.texture.anisotropy,
          \t    config.video.multisampling, config.video.verticalSync);"""
          if config_source.count(config_old) != 1:
              raise SystemExit("Expected GLideN64 config validation exactly once")
          config_path.write_text(config_source.replace(config_old, config_new, 1))
          # Force the Android EGL swap interval to zero for this isolated diagnostic.
          # The previous device log reported interval=1 despite GLideN64 verticalSync=0.
          native_path = Path("app/src/main/cpp/native-lib.cpp")
          native_source = native_path.read_text()
          old_attr_entry = """m64p_error androidVideoSetAttr(m64p_GLattr attr, int value) {
              const int index = static_cast<int>(attr);"""
          new_attr_entry = """m64p_error androidVideoSetAttr(m64p_GLattr attr, int value) {
              static std::atomic<unsigned int> attrLogCount{0};
              const unsigned int attrLogIndex = attrLogCount.fetch_add(1) + 1;
              if (attrLogIndex <= 32) {
                  __android_log_print(ANDROID_LOG_INFO, "N64AndroidVideo",
                                      "GL attr callback #%u attr=%d value=%d tid=%ld",
                                      attrLogIndex, static_cast<int>(attr), value,
                                      static_cast<long>(syscall(SYS_gettid)));
              }
              const int index = static_cast<int>(attr);"""
          if native_source.count(old_attr_entry) != 1:
              raise SystemExit("Expected androidVideoSetAttr entry exactly once")
          native_source = native_source.replace(old_attr_entry, new_attr_entry, 1)

          old_swap = """        if (eglSwapInterval(display, value) != EGL_TRUE) {
                      const EGLint error = eglGetError();
                      __android_log_print(ANDROID_LOG_WARN, "N64AndroidVideo",
                                          "eglSwapInterval(%d) recusado: EGL error=0x%04X",
                                          value, static_cast<unsigned int>(error));
                      return M64ERR_UNSUPPORTED;
                  }
                  __android_log_print(ANDROID_LOG_INFO, "N64AndroidVideo",
                                      "EGL swap interval aplicado: %d", value);"""
          new_swap = """        const int effectiveValue = 0;
                  __android_log_print(ANDROID_LOG_INFO, "N64AndroidVideo",
                                      "EGL swap interval solicitado=%d; forçado=%d",
                                      value, effectiveValue);
                  if (eglSwapInterval(display, effectiveValue) != EGL_TRUE) {
                      const EGLint error = eglGetError();
                      __android_log_print(ANDROID_LOG_WARN, "N64AndroidVideo",
                                          "eglSwapInterval(%d) recusado: EGL error=0x%04X",
                                          effectiveValue, static_cast<unsigned int>(error));
                      return M64ERR_UNSUPPORTED;
                  }
                  __android_log_print(ANDROID_LOG_INFO, "N64AndroidVideo",
                                      "EGL swap interval aplicado: %d", effectiveValue);"""
          if native_source.count(old_swap) != 1:
              raise SystemExit("Expected EGL swap interval block exactly once")
          native_path.write_text(native_source.replace(old_swap, new_swap, 1))

          PY
          git -C third_party/GLideN64 diff --check
          grep -F "M64P_GL_CONTEXT_PROFILE_ES" third_party/GLideN64/src/Graphics/OpenGLContext/mupen64plus/mupen64plus_DisplayWindow.cpp
          grep -F "M64P_GL_CONTEXT_MINOR_VERSION, 0" third_party/GLideN64/src/Graphics/OpenGLContext/mupen64plus/mupen64plus_DisplayWindow.cpp
          grep -F "FunctionWrapper::setThreadedMode(0)" third_party/GLideN64/src/Graphics/OpenGLContext/mupen64plus/mupen64plus_DisplayWindow.cpp
          grep -F "eglQuerySurface(display, surface, EGL_WIDTH" third_party/GLideN64/src/Graphics/OpenGLContext/mupen64plus/mupen64plus_DisplayWindow.cpp
          if grep -F "glGetIntegerv(GL_VIEWPORT" third_party/GLideN64/src/Graphics/OpenGLContext/mupen64plus/mupen64plus_DisplayWindow.cpp; then
            echo "Do not call wrapped glGetIntegerv before GL function initialization"
            exit 1
          fi

      - name: Instrument GLideN64 command processing timings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("third_party/GLideN64/src/common/CommonAPIImpl_common.cpp")
          source = path.read_text()
          if "N64ANDROID_GLIDE_TIMING" in source:
              raise SystemExit("GLideN64 timing instrumentation already present")
          include_anchor = "#include <osal_keys.h>\n"
          include_add = """#include <osal_keys.h>
          #if defined(OS_ANDROID)
          #include <atomic>
          #include <chrono>
          #include <android/log.h>
          #endif
          """
          if source.count(include_anchor) != 1:
              raise SystemExit("Expected GLideN64 include anchor exactly once")
          source = source.replace(include_anchor, include_add, 1)
          helper = """
          #if defined(OS_ANDROID)
          // N64ANDROID_GLIDE_TIMING: low-overhead aggregate timing for plugin command callbacks.
          namespace {
          struct AndroidGlideTiming {
              std::atomic<unsigned int> calls{0};
              std::atomic<unsigned long long> totalNs{0};
              std::atomic<unsigned long long> maxNs{0};
          };
          static AndroidGlideTiming g_androidDListTiming;
          static AndroidGlideTiming g_androidRdpTiming;
          static AndroidGlideTiming g_androidViTiming;
          static void recordAndroidGlideTiming(AndroidGlideTiming& stats, const char* label,
                                               std::chrono::steady_clock::time_point start) {
              const auto elapsed = std::chrono::duration_cast<std::chrono::nanoseconds>(
                  std::chrono::steady_clock::now() - start).count();
              const auto ns = static_cast<unsigned long long>(elapsed > 0 ? elapsed : 0);
              stats.totalNs.fetch_add(ns, std::memory_order_relaxed);
              auto oldMax = stats.maxNs.load(std::memory_order_relaxed);
              while (ns > oldMax && !stats.maxNs.compare_exchange_weak(
                  oldMax, ns, std::memory_order_relaxed)) {}
              const unsigned int count = stats.calls.fetch_add(1, std::memory_order_relaxed) + 1;
              if ((count % 120) == 0) {
                  const auto total = stats.totalNs.exchange(0, std::memory_order_relaxed);
                  const auto maximum = stats.maxNs.exchange(0, std::memory_order_relaxed);
                  __android_log_print(ANDROID_LOG_INFO, "N64AndroidVideo",
                      "GLIDE_TIMING stage=%s calls=120 avg_ms=%.3f max_ms=%.3f",
                      label, static_cast<double>(total) / 120000000.0,
                      static_cast<double>(maximum) / 1000000.0);
              }
          }
          }
          #endif
          """
          anchor = "PluginAPI & PluginAPI::get()\n"
          if source.count(anchor) != 1:
              raise SystemExit("Expected PluginAPI singleton anchor exactly once")
          source = source.replace(anchor, helper + "\n" + anchor, 1)

          def instrument(function, label, stats):
              nonlocal_source = source_holder[0]
              start = nonlocal_source.find(function)
              if start < 0:
                  raise SystemExit("Function not found: " + function)
              brace = nonlocal_source.find("{", start)
              end = nonlocal_source.find("\n}\n", brace)
              if end < 0:
                  raise SystemExit("Function end not found: " + function)
              body = nonlocal_source[brace + 1:end]
              if "recordAndroidGlideTiming" in body:
                  raise SystemExit("Function already instrumented: " + function)
              begin = """
          #if defined(OS_ANDROID)
              const auto androidTimingStart = std::chrono::steady_clock::now();
          #endif
          """
              finish = """
          #if defined(OS_ANDROID)
              recordAndroidGlideTiming(%s, "%s", androidTimingStart);
          #endif
          """ % (stats, label)
              source_holder[0] = nonlocal_source[:brace + 1] + begin + body + finish + nonlocal_source[end:]
          source_holder = [source]
          instrument("void PluginAPI::ProcessDList()", "ProcessDList", "g_androidDListTiming")
          instrument("void PluginAPI::ProcessRDPList()", "ProcessRDPList", "g_androidRdpTiming")
          instrument("void PluginAPI::UpdateScreen()", "UpdateScreen", "g_androidViTiming")
          path.write_text(source_holder[0])

          # Split VI_UpdateScreen into its expensive framebuffer and presentation stages.
          vi_path = Path("third_party/GLideN64/src/VI.cpp")
          vi = vi_path.read_text()
          include_anchor = "#include <Graphics/Context.h>\n"
          if vi.count(include_anchor) != 1:
              raise SystemExit("Expected VI.cpp context include exactly once")
          vi = vi.replace(include_anchor, include_anchor + """#if defined(OS_ANDROID)
          #include <chrono>
          #include <android/log.h>
          #endif
          """, 1)
          helper = r"""
          #if defined(OS_ANDROID)
          // Per-call-site timing: VI callbacks run on the GLSurfaceView GL thread.
          #define N64ANDROID_VI_MEASURE(label, expression) do { \
              static unsigned int n64_calls = 0; \
              static unsigned long long n64_total_ns = 0; \
              static unsigned long long n64_max_ns = 0; \
              const auto n64_start = std::chrono::steady_clock::now(); \
              expression; \
              const auto n64_elapsed = std::chrono::duration_cast<std::chrono::nanoseconds>( \
                  std::chrono::steady_clock::now() - n64_start).count(); \
              const auto n64_ns = static_cast<unsigned long long>(n64_elapsed > 0 ? n64_elapsed : 0); \
              n64_total_ns += n64_ns; \
              if (n64_ns > n64_max_ns) n64_max_ns = n64_ns; \
              if (++n64_calls == 120) { \
                  __android_log_print(ANDROID_LOG_INFO, "N64AndroidVideo", \
                      "VI_STAGE stage=%s calls=120 avg_ms=%.3f max_ms=%.3f", label, \
                      static_cast<double>(n64_total_ns) / 120000000.0, \
                      static_cast<double>(n64_max_ns) / 1000000.0); \
                  n64_calls = 0; n64_total_ns = 0; n64_max_ns = 0; \
              } \
          } while (0)
          #else
          #define N64ANDROID_VI_MEASURE(label, expression) do { expression; } while (0)
          #endif
          """
          vi_anchor = "void VI_UpdateScreen()\n{"
          if vi.count(vi_anchor) != 1:
              raise SystemExit("Expected VI_UpdateScreen definition exactly once")
          vi = vi.replace(vi_anchor, helper + "\n" + vi_anchor, 1)

          replacements = [
              ("FrameBuffer * pBuffer = frameBufferList().findBuffer(*REG.VI_ORIGIN & 0xffffff);",
               "FrameBuffer * pBuffer = nullptr;\n\t\tN64ANDROID_VI_MEASURE(\"findBuffer\", pBuffer = frameBufferList().findBuffer(*REG.VI_ORIGIN & 0xffffff));"),
              ("\t\t\t\tpBuffer->copyRdram();",
               "\t\t\t\tN64ANDROID_VI_MEASURE(\"copyRdram\", pBuffer->copyRdram());"),
              ("\t\t\t\tFrameBuffer_CopyFromRDRAM(*REG.VI_ORIGIN & 0xffffff, bCFB);",
               "\t\t\t\tN64ANDROID_VI_MEASURE(\"copyFromRDRAM\", FrameBuffer_CopyFromRDRAM(*REG.VI_ORIGIN & 0xffffff, bCFB));")
          ]
          for old, new in replacements:
              if vi.count(old) != 1:
                  raise SystemExit("Expected VI stage call exactly once: " + old.strip())
              vi = vi.replace(old, new, 1)

          render_call = "\t\t\tframeBufferList().renderBuffer();"
          if vi.count(render_call) != 2:
              raise SystemExit("Expected two renderBuffer call sites in VI_UpdateScreen")
          vi = vi.replace(render_call, "\t\t\tN64ANDROID_VI_MEASURE(\"renderBuffer\", frameBufferList().renderBuffer());")
          vi_path.write_text(vi)
          PY
          git -C third_party/GLideN64 diff --check
          grep -F "GLIDE_TIMING stage=ProcessDList" third_party/GLideN64/src/common/CommonAPIImpl_common.cpp || true
      - name: Validate pinned Core source manifest
        run: >-
          cmake
          -DMUPEN64PLUS_CORE_SOURCE_DIR="$GITHUB_WORKSPACE/third_party/mupen64plus-core"
          -P cmake/Mupen64PlusCoreSources.cmake

      - name: Test ARM64 assembly offset generator with binary object
        run: |
          mkdir -p build/asm-defines-fixture
          cat > build/asm-defines-fixture/asm_defines.c <<'EOF'
          const char device_r4300[] = "\n@ASM_DEFINE offsetof_struct_device_r4300 0x00000010\n";
          const char dynarec_pc[] = "\n@ASM_DEFINE offsetof_struct_new_dynarec_hot_state_pc 0x00000020\n";
          EOF
          cc -c -fno-lto build/asm-defines-fixture/asm_defines.c -o build/asm-defines-fixture/asm_defines.o
          cmake -DINPUT_OBJECT="$GITHUB_WORKSPACE/build/asm-defines-fixture/asm_defines.o" -DOUTPUT_DIR="$GITHUB_WORKSPACE/build/asm-defines-fixture/generated" -P cmake/GenerateMupen64PlusAsmDefines.cmake
          grep -F '#define offsetof_struct_device_r4300 (0x00000010)' build/asm-defines-fixture/generated/asm_defines_gas.h
          grep -F '%define offsetof_struct_new_dynarec_hot_state_pc (0x00000020)' build/asm-defines-fixture/generated/asm_defines_nasm.h

      - name: Test native shutdown EGL requirement policy
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror \
            -Iapp/src/main/cpp \
            tests/native/core_shutdown_teardown_policy_test.cpp \
            -o build-core-shutdown-teardown-policy-test
          ./build-core-shutdown-teardown-policy-test

      - name: Test Core call lease and shutdown drain
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pthread \
            -Iapp/src/main/cpp \
            tests/native/core_call_gate_test.cpp \
            -o build-core-call-gate-test
          ./build-core-call-gate-test

      - name: Test Core runtime lifecycle coordinator
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pthread \
            -Iapp/src/main/cpp \
            tests/native/core_runtime_coordinator_test.cpp \
            -o build-core-runtime-coordinator-test
          ./build-core-runtime-coordinator-test

      - name: Test Core run-loop readiness handshake
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pthread \
            -Iapp/src/main/cpp \
            tests/native/core_run_loop_handshake_test.cpp \
            -o build-core-run-loop-handshake-test
          ./build-core-run-loop-handshake-test

      - name: Test two-phase Core shutdown gate
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pthread \
            -Iapp/src/main/cpp \
            tests/native/core_shutdown_phase_gate_test.cpp \
            -o build-core-shutdown-phase-gate-test
          ./build-core-shutdown-phase-gate-test

      - name: Test ordered native shutdown teardown progress
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pthread \
            -Iapp/src/main/cpp \
            tests/native/core_shutdown_teardown_progress_test.cpp \
            -o build-core-shutdown-teardown-progress-test
          ./build-core-shutdown-teardown-progress-test

      - name: Test retry-safe native shutdown teardown executor
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pthread \
            -Iapp/src/main/cpp \
            tests/native/core_shutdown_teardown_executor_test.cpp \
            -o build-core-shutdown-teardown-executor-test
          ./build-core-shutdown-teardown-executor-test

      - name: Test persistent native shutdown teardown session
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pthread \
            -Iapp/src/main/cpp \
            tests/native/core_shutdown_teardown_session_test.cpp \
            -o build-core-shutdown-teardown-session-test
          ./build-core-shutdown-teardown-session-test

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android NDK and CMake
        run: sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Build GLideN64 renderer independently for Android ARM64
        run: |
          NDK="$ANDROID_HOME/ndk/27.0.12077973"
          cmake -S third_party/GLideN64/src -B build/gliden64-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DANDROID=ON \
            -DEGL=ON \
            -DMUPENPLUSAPI=ON \
            -DNO_OSD=ON \
            -DNOHQ=ON \
            -DCRC_ARMV8=OFF \
            -DUSE_IPO=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/gliden64-arm64 --parallel 2
          PLUGIN="build/gliden64-arm64/plugin/Release/libmupen64plus-video-GLideN64.so"
          test -s "$PLUGIN"
          readelf --dyn-syms -W "$PLUGIN" | grep -E "[[:space:]]PluginGetVersion$"
          readelf --dyn-syms -W "$PLUGIN" | grep -E "[[:space:]]PluginStartup$"
          readelf --dyn-syms -W "$PLUGIN" | grep -E "[[:space:]]InitiateGFX$"
          readelf --dyn-syms -W "$PLUGIN" | grep -E "[[:space:]]ProcessDList$"
          readelf --dyn-syms -W "$PLUGIN" | grep -E "[[:space:]]ProcessRDPList$"
          for symbol in PluginShutdown ChangeWindow MoveScreen RomClosed RomOpen ShowCFB UpdateScreen ViStatusChanged ViWidthChanged ReadScreen2 SetRenderingCallback FBRead FBWrite FBGetFrameBufferInfo; do
            readelf --dyn-syms -W "$PLUGIN" | grep -E "[[:space:]]${symbol}$"
          done
          file "$PLUGIN"
          mkdir -p build/native-libs/arm64-v8a
          cp "$PLUGIN" build/native-libs/arm64-v8a/libmupen64plus-video-GLideN64.so
          test -s build/native-libs/arm64-v8a/libmupen64plus-video-GLideN64.so

      - name: Generate ARM64 offsets from the pinned Core with the Android NDK
        run: |
          NDK_CLANG="$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android23-clang"
          CORE_DIR="$GITHUB_WORKSPACE/third_party/mupen64plus-core"
          mkdir -p build/arm64-asm-defines
          "$NDK_CLANG" -DNEW_DYNAREC=4 -DDYNAREC -fno-lto \
            -I"$CORE_DIR/src" \
            -I"$CORE_DIR/src/asm_defines" \
            -I"$CORE_DIR/subprojects/xxhash" \
            -I"$CORE_DIR/subprojects/md5" \
            -I"$CORE_DIR/subprojects/minizip" \
            -c "$CORE_DIR/src/asm_defines/asm_defines.c" \
            -o build/arm64-asm-defines/asm_defines.o
          cmake \
            -DINPUT_OBJECT="$GITHUB_WORKSPACE/build/arm64-asm-defines/asm_defines.o" \
            -DOUTPUT_DIR="$GITHUB_WORKSPACE/build/arm64-asm-defines/generated" \
            -P cmake/GenerateMupen64PlusAsmDefines.cmake
          grep -F '#define offsetof_struct_device_r4300 (' build/arm64-asm-defines/generated/asm_defines_gas.h
          grep -F '#define offsetof_struct_new_dynarec_hot_state_pc (' build/arm64-asm-defines/generated/asm_defines_gas.h
          test "$(grep -c '^#define offsetof_struct_' build/arm64-asm-defines/generated/asm_defines_gas.h)" -ge 20

      - name: Configure pinned SDL2 for Android ARM64
        run: |
          NDK="$ANDROID_HOME/ndk/27.0.12077973"
          cmake -S third_party/SDL -B build/sdl2-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=OFF \
            -DSDL_TEST=OFF \
            -DSDL_TESTS=OFF
          cmake --build build/sdl2-arm64 --parallel 2
          test -s build/sdl2-arm64/libSDL2.so
          file build/sdl2-arm64/libSDL2.so

      - name: Build Mupen64Plus HLE RSP plugin for Android ARM64
        run: |
          NDK="$ANDROID_HOME/ndk/27.0.12077973"
          RSP_DIR="$GITHUB_WORKSPACE/third_party/mupen64plus-rsp-hle"
          CORE_API="$GITHUB_WORKSPACE/third_party/mupen64plus-core/src/api"
          RSP_CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android23-clang"
          make -C "$RSP_DIR/projects/unix" all \
            HOST_CPU=aarch64 \
            CC="$RSP_CC" \
            APIDIR="$CORE_API" \
            OPTFLAGS="-O2" \
            WARNFLAGS="-Wall"
          RSP_PLUGIN="$RSP_DIR/projects/unix/mupen64plus-rsp-hle.so"
          test -s "$RSP_PLUGIN"
          for symbol in PluginGetVersion PluginStartup PluginShutdown InitiateRSP DoRspCycles RomClosed; do
            readelf --dyn-syms -W "$RSP_PLUGIN" | grep -E "[[:space:]]${symbol}$"
          done
          mkdir -p build/native-libs/arm64-v8a
          cp "$RSP_PLUGIN" build/native-libs/arm64-v8a/libmupen64plus-rsp-hle.so
          file build/native-libs/arm64-v8a/libmupen64plus-rsp-hle.so

      - name: Build Mupen64Plus SDL audio plugin for Android ARM64
        run: |
          NDK="$ANDROID_HOME/ndk/27.0.12077973"
          AUDIO_DIR="$GITHUB_WORKSPACE/third_party/mupen64plus-audio-sdl"
          CORE_API="$GITHUB_WORKSPACE/third_party/mupen64plus-core/src/api"
          AUDIO_CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android23-clang"
          SDL_INCLUDE="$GITHUB_WORKSPACE/third_party/SDL/include"
          SDL_LIB="$GITHUB_WORKSPACE/build/sdl2-arm64"
          # Force a fresh compile so the patched SDL backend cannot be hidden by stale objects.
          rm -rf "$AUDIO_DIR/projects/unix/_obj" \
                 "$AUDIO_DIR/projects/unix/mupen64plus-audio-sdl.so"
          make -C "$AUDIO_DIR/projects/unix" all \
            UNAME=Linux \
            HOST_CPU=aarch64 \
            CC="$AUDIO_CC" \
            APIDIR="$CORE_API" \
            SDL_CFLAGS="-I$SDL_INCLUDE" \
            SDL_LDLIBS="-L$SDL_LIB -lSDL2" \
            NO_SPEEX=1 \
            NO_SRC=1 \
            NO_OSS=1 \
            OPTFLAGS="-O2" \
            WARNFLAGS="-Wall"
          AUDIO_PLUGIN="$AUDIO_DIR/projects/unix/mupen64plus-audio-sdl.so"
          test -s "$AUDIO_PLUGIN"
          # Fail the build unless the diagnostic code is present in the actual shared object.
          strings "$AUDIO_PLUGIN" | grep -F "N64ANDROID AUDIO: SDL_Init resultado="
          strings "$AUDIO_PLUGIN" | grep -F "N64ANDROID AUDIO: SDL_SetMainReady chamado antes do SDL_Init."
          readelf --dyn-syms -W "$AUDIO_PLUGIN" | grep -E "[[:space:]]SDL_SetMainReady$"
          strings "$AUDIO_PLUGIN" | grep -F "Failed to initialize SDL audio subsystem: %s"
          for symbol in PluginGetVersion PluginStartup PluginShutdown InitiateAudio AiDacrateChanged AiLenChanged; do
            readelf --dyn-syms -W "$AUDIO_PLUGIN" | grep -E "[[:space:]]${symbol}$"
          done
          mkdir -p build/native-libs/arm64-v8a
          cp "$AUDIO_PLUGIN" build/native-libs/arm64-v8a/libmupen64plus-audio-sdl.so
          readelf -d build/native-libs/arm64-v8a/libmupen64plus-audio-sdl.so
          file build/native-libs/arm64-v8a/libmupen64plus-audio-sdl.so

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          # SDL's upstream Android template contains its own wrapper JAR.
          # This workflow does not execute that wrapper; it invokes the pinned Gradle version above.
          validate-wrappers: false

      - name: Run Kotlin JVM unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify Core is packaged separately from the JNI bridge
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          unzip -Z1 "$APK" | grep -Fx "lib/arm64-v8a/libn64bridge.so"
          unzip -Z1 "$APK" | grep -Fx "lib/arm64-v8a/libSDL2.so"
          unzip -Z1 "$APK" | grep -Fx "lib/arm64-v8a/libmupen64plus.so"
          unzip -Z1 "$APK" | grep -Fx "lib/arm64-v8a/libmupen64plus-video-android.so"
          unzip -Z1 "$APK" | grep -Fx "lib/arm64-v8a/libmupen64plus-video-GLideN64.so"
          unzip -Z1 "$APK" | grep -Fx "lib/arm64-v8a/libmupen64plus-rsp-hle.so"
          unzip -Z1 "$APK" | grep -Fx "lib/arm64-v8a/libmupen64plus-audio-sdl.so"
          unzip -p "$APK" lib/arm64-v8a/libmupen64plus-audio-sdl.so > build/audio-plugin-from-apk.so
          strings build/audio-plugin-from-apk.so | grep -F "N64ANDROID AUDIO: SDL_Init resultado="
          strings build/audio-plugin-from-apk.so | grep -F "Failed to initialize SDL audio subsystem: %s"
          unzip -p "$APK" lib/arm64-v8a/libmupen64plus-video-GLideN64.so > build/gliden64-from-apk.so
          for symbol in PluginGetVersion PluginStartup PluginShutdown ChangeWindow InitiateGFX MoveScreen ProcessDList ProcessRDPList RomClosed RomOpen ShowCFB UpdateScreen ViStatusChanged ViWidthChanged ReadScreen2 SetRenderingCallback FBRead FBWrite FBGetFrameBufferInfo; do
            readelf --dyn-syms -W build/gliden64-from-apk.so | grep -E "[[:space:]]${symbol}$"
          done
          readelf -d build/gliden64-from-apk.so
          unzip -p "$APK" lib/arm64-v8a/libn64bridge.so > build/n64bridge-from-apk.so
          unzip -p "$APK" lib/arm64-v8a/libmupen64plus.so > build/mupen64plus-from-apk.so
          unzip -p "$APK" lib/arm64-v8a/libmupen64plus-video-android.so > build/gfx-plugin-from-apk.so
          readelf --dyn-syms -W build/gfx-plugin-from-apk.so | grep -E "[[:space:]]PluginGetVersion$"
          readelf --dyn-syms -W build/gfx-plugin-from-apk.so | grep -E "[[:space:]]PluginStartup$"
          unzip -p "$APK" lib/arm64-v8a/libmupen64plus-rsp-hle.so > build/rsp-hle-from-apk.so
          for symbol in PluginGetVersion PluginStartup PluginShutdown InitiateRSP DoRspCycles RomClosed; do
            readelf --dyn-syms -W build/rsp-hle-from-apk.so | grep -E "[[:space:]]${symbol}$"
          done
          if readelf -d build/n64bridge-from-apk.so | grep -Eq "Shared library: \\[(libSDL2|libmupen64plus)\\.so\\]"; then
            echo "JNI bridge must not load SDL2 or Core as startup dependencies"
            exit 1
          fi
          readelf -d build/mupen64plus-from-apk.so | grep -F "Shared library: [libSDL2.so]"
          readelf --dyn-syms -W build/mupen64plus-from-apk.so | grep -E "[[:space:]]CoreStartup$"
          readelf --dyn-syms -W build/mupen64plus-from-apk.so | grep -E "[[:space:]]CoreShutdown$"
          for symbol in VidExt_Init VidExt_Quit VidExt_ListFullscreenModes VidExt_ListFullscreenRates VidExt_SetVideoMode VidExt_SetVideoModeWithRate VidExt_SetCaption VidExt_ToggleFullScreen VidExt_ResizeWindow VidExt_GL_GetProcAddress VidExt_GL_SetAttribute VidExt_GL_GetAttribute VidExt_GL_SwapBuffers VidExt_GL_GetDefaultFramebuffer; do
            readelf --dyn-syms -W build/mupen64plus-from-apk.so | grep -E "[[:space:]]${symbol}$"
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: n64-android-core-isolated-diagnostic
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
