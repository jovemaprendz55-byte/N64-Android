name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout pinned Mupen64Plus Core sources
        uses: actions/checkout@v4
        with:
          repository: mupen64plus/mupen64plus-core
          ref: a9ca8ec0b7decd17390c76c6341cf423d5d79321
          path: third_party/mupen64plus-core

      - name: Validate pinned Core source manifest
        run: >-
          cmake
          -DMUPEN64PLUS_CORE_SOURCE_DIR="$GITHUB_WORKSPACE/third_party/mupen64plus-core"
          -P cmake/Mupen64PlusCoreSources.cmake

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android NDK and CMake
        run: sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: n64-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
